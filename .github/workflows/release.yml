# Publishes a GitHub release for each new app version that reaches main. When
# apps/desktop/src-tauri/tauri.conf.json has a version with no release yet,
# builds spark-desktop and spark-cli for Windows ARM64 and x64, runs
# `spark-cli doctor` on real Windows machines of both architectures, and
# releases the zips as v<version>.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release

permissions:
  contents: read

jobs:
  version:
    if: github.repository == 'Trillx/spark-rs'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          npm=$(jq -r .version apps/desktop/package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)
          if [ "$npm" != "$version" ] || [ "$cargo" != "$version" ]; then
            echo "::error::Version mismatch: tauri.conf.json $version, package.json $npm, Cargo.toml $cargo"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - { arch: arm64, target: aarch64-pc-windows-msvc, xwin: aarch64 }
          - { arch: x64, target: x86_64-pc-windows-msvc, xwin: x86_64 }
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NAME: spark-rs-v${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build the UI
        working-directory: apps/desktop
        run: npm ci && npm run build
      - name: Build spark-desktop and spark-cli
        env:
          SPARK_CROSS_DOCKER_ARGS: -e XWIN_ARCH=${{ matrix.xwin }}
        run: >-
          tools/cross/run.sh cargo xwin build --release --locked --target ${{ matrix.target }}
          -p spark-desktop -p spark-cli
      - name: Check the exes need no VC++ Redistributable
        run: |
          for exe in spark-desktop spark-cli; do
            if tools/cross/run.sh llvm-readobj --coff-imports "target/${{ matrix.target }}/release/$exe.exe" \
              | grep -iE 'Name: (vcruntime|msvcp)'; then
              echo "::error::$exe.exe needs the VC++ Redistributable"
              exit 1
            fi
          done
      - name: Package
        run: |
          mkdir "$NAME"
          cp target/${{ matrix.target }}/release/{spark-desktop,spark-cli}.exe "$NAME/"
          zip -r "$NAME.zip" "$NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: ${{ env.NAME }}.zip
          if-no-files-found: error

  smoke:
    needs: [version, build]
    strategy:
      matrix:
        include:
          - { arch: arm64, runner: windows-11-arm }
          - { arch: x64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      NAME: spark-rs-v${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-${{ matrix.arch }}
      - name: spark-cli doctor
        shell: pwsh
        run: |
          Expand-Archive "$env:NAME.zip" -DestinationPath .
          & "./$env:NAME/spark-cli.exe" doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish:
    needs: [version, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Write release notes
        run: |
          (cd release && sha256sum -- *.zip > SHA256SUMS.txt)
          {
            echo "## Download"
            echo
            echo "- Windows on ARM: \`spark-rs-v$VERSION-windows-arm64.zip\`"
            echo "- Windows x64 (Intel/AMD): \`spark-rs-v$VERSION-windows-x64.zip\`"
            echo
            echo "Unzip and run \`spark-desktop.exe\`. It needs the WebView2 runtime, which Windows 11 includes."
            echo "The exes aren't code-signed, so SmartScreen may warn the first time: More info → Run anyway."
            echo
            echo "## Changes"
            echo
            if previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null); then
              git log --no-merges --format='- %s' "$previous..HEAD"
            else
              echo "First release."
            fi
          } > notes.md
          cat notes.md
      - name: Publish v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v$VERSION" release/*
          --target "$GITHUB_SHA" --title "spark-rs $VERSION" --notes-file notes.md
