[package]
name = "spark-desktop"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
keyring-core = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spark-ai = { version = "0.1.0", path = "../../../crates/ai" }
tauri = "2.12.5"

# The OS credential store for API keys; see `ai/keys.rs`.
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"

[build-dependencies]
tauri-build = "2.7.4"
