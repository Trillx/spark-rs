[package]
name = "spark-desktop"
version = "0.2.0"
edition.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.34"
keyring-core = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
# The app version (`X.Y.Z+N` for CI builds) is a `semver::Version`.
semver = "1.0.28"
serde_json = "1.0.154"
open = "5.4.5"
# Native open/save dialogs for attachments.
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
spark-agent = { version = "0.1.0", path = "../../../crates/agent" }
spark-ai = { version = "0.1.0", path = "../../../crates/ai" }
spark-mail = { version = "0.1.0", path = "../../../crates/mail" }
spark-store = { version = "0.1.0", path = "../../../crates/store" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
# A second launch brings the running app forward instead of syncing twice.
tauri-plugin-single-instance = "2.5.4"
# Updates from main's builds (`updates.rs`). Without its default features it uses
# the workspace's reqwest, whose TLS runs on aws-lc-rs: its own `rustls-tls`
# feature brings in ring, which doesn't build for ARM64 Windows here.
tauri-plugin-updater = { version = "2.14.0", default-features = false }
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "sync", "time"] }
url = "2.5.8"

[target.'cfg(target_os = "windows")'.dependencies]
# The OS credential store for API keys; see `ai/keys.rs`.
windows-native-keyring-store = { version = "1.1.0", default-features = false }
# New-mail and calendar toasts (`notify.rs`) with the user's clock and dates
# (`alerts.rs`), opening at sign-in (`background.rs`), the meeting chime
# (`chime.rs`) and forgetting saved passwords on uninstall (`secrets.rs`). The
# same versions Tauri already uses.
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "Foundation_Collections", "UI_Notifications", "Win32_Foundation", "Win32_Globalization", "Win32_Media_Audio", "Win32_Security_Credentials"] }
windows-registry = "0.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

# Embeds the built UI (apps/desktop/dist) in the binary. Without it the window
# loads the Vite dev server at localhost:1420 and stays empty. `tauri dev`
# turns default features off, so it still uses the dev server.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
