[package]
name = "spark-mail"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
ammonia = "4.2.4"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22.1"
dom_query = { version = "0.28.0", default-features = false }
futures-util = "0.3.34"
getrandom = "0.3.4"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "charset", "http2", "system-proxy", "form"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
spark-store = { version = "0.1.0", path = "../store" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "time", "macros", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
url = "2.5.8"
