[package]
name = "spark-ai"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2", "charset", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util"] }
