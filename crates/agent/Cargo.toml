[package]
name = "spark-agent"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
dirs = "7.0.0"
getrandom = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "net", "rt"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt"] }
